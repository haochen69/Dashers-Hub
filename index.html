        :root {
            --primary: #00d2ff;
            --secondary: #92fe9d;
            --bg: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --grid-color: rgba(0, 210, 255, 0.08);
            --danger: #ff4e50;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body::-webkit-scrollbar { display: none; }
        body { 
            background-color: var(--bg); 
            color: white; 
            min-height: 100vh; 
            -ms-overflow-style: none; 
            scrollbar-width: none; 
            overflow-x: hidden;
        }

        #grid-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
            background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 45px 45px;
            mask-image: radial-gradient(circle at var(--x, 50%) var(--y, 50%), black 0%, transparent 85%);
            -webkit-mask-image: radial-gradient(circle at var(--x, 50%) var(--y, 50%), black 0%, transparent 85%);
        }

        #particle-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }

        nav { position: absolute; top: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 30px 5%; height: 80px; z-index: 110; }
        .logo { font-size: 1.8rem; font-weight: 900; background: linear-gradient(45deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; cursor: pointer; }
        .nav-right { display: flex; gap: 10px; }
        .nav-btn { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 10px 25px; border-radius: 50px; text-decoration: none; font-weight: 700; transition: 0.3s; cursor: pointer; }

        .page-section { 
            display: none; opacity: 0; transform: translateY(20px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            width: 100%;
        }
        
        #landing-page { height: 100vh; flex-direction: column; align-items: center; justify-content: center; text-align: center; display: flex; opacity: 1; transform: translateY(0); }
        #games-page, #settings-page { padding: 120px 5% 60px; max-width: 1400px; margin: auto; }

        #game-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; background: black; }
        iframe { width: 100%; height: 100%; border: none; }

        /* ORIGINAL PAUSE ANIMATIONS */
        #pause-trigger {
            display: none; position: fixed; top: 0; left: 50%; transform: translateX(-50%);
            width: 180px; height: 40px; background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px); z-index: 2500; cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2); border-top: none; border-radius: 0 0 20px 20px;
            align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 900;
            color: white; animation: slideDown 0.5s ease;
        }
        @keyframes slideDown { from { top: -50px; } to { top: 0; } }

        #pause-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(15px); z-index: 3000;
            flex-direction: column; justify-content: center; align-items: center;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* SEARCH BAR */
        .search-container { position: relative; width: 300px; }
        #gameSearch {
            width: 100%; padding: 12px 25px; border-radius: 50px;
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1);
            color: white; font-weight: 600; outline: none; transition: 0.3s;
        }
        #gameSearch:focus { border-color: var(--primary); background: rgba(255,255,255,0.1); }

        .action-btn { width: 280px; margin: 12px; padding: 18px; border-radius: 50px; border: none; font-weight: 900; cursor: pointer; font-size: 1.2rem; transition: 0.3s; color: white; }
        .primary-btn { background: var(--primary); }
        .secondary-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2); }
        .danger-btn { background: var(--danger); }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 25px; }
        .game-card { background: var(--card-bg); border-radius: 24px; padding: 35px 20px; text-align: center; border: 1px solid rgba(255,255,255,0.1); transition: 0.4s; cursor: pointer; }
        .game-card:hover { transform: translateY(-10px); border-color: var(--primary); background: rgba(0, 210, 255, 0.05); }
        
        h1 { font-size: 5.5rem; font-weight: 900; animation: bounce 3s ease-in-out infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
    </style>
</head>

        let isPlaying = false, isPaused = false;

        function showPage(pageId) {
            const sections = document.querySelectorAll('.page-section');
            sections.forEach(s => {
                s.style.display = 'none';
                s.style.opacity = '0';
                s.style.transform = 'translateY(20px)';
            });

            const target = document.getElementById(pageId);
            if (pageId === 'landing-page') {
                target.style.display = 'flex';
            } else {
                target.style.display = 'block';
            }
            
            setTimeout(() => {
                target.style.opacity = '1';
                target.style.transform = 'translateY(0)';
            }, 50);
        }

        const phrases = ["i cant decide, dashers network or dashers hub?", "the chickens are watching", "honestly sushi is overrated", "join our discord! we have 4 mil proxy links ready to be used", "penalty is the goat (and birdcat and virgo too pls dont hurt me)", "you should never argue with dumb people", "i wonder why no one argues with me", "we are special", "bro just play some games already", "we support the lbgtq (light blue greasy tender quesadillas)", "inspired by frosty chicken"];
        let phraseIdx = 0;
        setInterval(() => {
            const sub = document.getElementById('subtitle');
            if(sub && document.getElementById('landing-page').style.display !== 'none') {
                sub.style.opacity = 0;
                setTimeout(() => {
                    phraseIdx = (phraseIdx + 1) % phrases.length;
                    sub.innerText = phrases[phraseIdx];
                    sub.style.opacity = 1;
                }, 800);
            }
        }, 4000);

        function togglePause() {
            if (!isPlaying) return;
            isPaused = !isPaused;
            const menu = document.getElementById('pause-overlay');
            const frame = document.getElementById('game-frame');
            const trigger = document.getElementById('pause-trigger');

            if (isPaused) {
                menu.style.display = 'flex';
                frame.style.opacity = '0.05'; 
                trigger.style.display = 'none';
            } else {
                menu.style.display = 'none';
                frame.style.opacity = '1';
                trigger.style.display = 'flex';
                frame.focus();
            }
        }

        function launchGame(url) {
            isPlaying = true;
            document.getElementById('game-view').style.display = 'block';
            document.getElementById('pause-trigger').style.display = 'flex';
            const frame = document.getElementById('game-frame');
            frame.src = url;
            frame.style.opacity = '1';
            frame.onload = () => frame.focus();
        }

        function closeGame() {
            isPlaying = false; isPaused = false;
            document.getElementById('pause-overlay').style.display = 'none';
            document.getElementById('game-view').style.display = 'none';
            document.getElementById('pause-trigger').style.display = 'none';
            document.getElementById('game-frame').src = ""; 
        }

        function filterGames() {
            const query = document.getElementById('gameSearch').value.toLowerCase();
            const cards = document.querySelectorAll('.game-card');
            cards.forEach(card => {
                const name = card.querySelector('h3').innerText.toLowerCase();
                card.style.display = name.includes(query) ? 'block' : 'none';
            });

        const canvas = document.getElementById('particle-canvas'), ctx = canvas.getContext('2d');
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        class P { constructor() { this.reset(); } reset() { this.x = Math.random()*canvas.width; this.y = Math.random()*canvas.height; this.s = Math.random()*2+1; this.v = Math.random()*1+0.5; this.o = Math.random()*0.5+0.2; } update() { this.y += this.v; if (this.y > canvas.height) this.y = -10; } draw() { ctx.fillStyle = `rgba(255,255,255,${this.o})`; ctx.beginPath(); ctx.arc(this.x, this.y, this.s, 0, Math.PI*2); ctx.fill(); } }
        for(let i=0; i<80; i++) particles.push(new P());
        function anim() { ctx.clearRect(0,0,canvas.width,canvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(anim); }
        anim();
